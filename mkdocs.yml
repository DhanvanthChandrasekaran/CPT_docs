site_name: CPT Project Documentation
site_url: https://.github.io//
theme:
  name: readthedocs

markdown_extensions:
  - pymdownx.highlight: # Syntax highlighting for code
      anchor_linenums: true
  - pymdownx.superfences # Allows nested code blocks
  - pymdownx.arithmatex: # Essential for LaTeX math rendering
      generic: true
  - admonition # Allows warning/note callouts
extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js